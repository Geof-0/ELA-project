<!DOCTYPE html>
<head>
    <meta charset = "UTF-8">
    <title>ELA project website</title>
    <!--link rel= "stylesheet" href= "style.css"-->
    <script>
        // script to provide css file based on users 
        document.addEventListener('DOMContentLoaded', () =>{
        let viewportWidth = window.innerWidth;
        let viewportHeight = window.innerHeight;
        const client_is_phone = viewportWidth < 1200; //12000 for testing, return to 1200 for default

        console.log(`${viewportWidth}, ${viewportHeight}`)

        const linkElement = document.createElement('link')

        const scriptElement = document.createElement('script')
        scriptElement.defer = true;

        if (client_is_phone) {
            // phone styling
            linkElement.rel = 'stylesheet'
            linkElement.href = 'phoneStyle.css'
            scriptElement.src = "phoneScript.js"
            document.getElementById("computerBody").style.display = 'None'
        } else {
            // computer styling
            linkElement.rel = 'stylesheet'
            linkElement.href = 'style.css'
            scriptElement.src = "script.js"
            document.getElementById("phoneBody").style.display = 'None'
        }

        // document.getElementById("menuTitle").textContent = `screen size: ${viewportWidth}, ${viewportHeight}`; -- for testing
        document.head.appendChild(linkElement)
        document.head.appendChild(scriptElement)
    });
    </script>
</head>
<body id="body">


    <div id="computerBody">
        <!-- all visible elements for computer -->
        <div id="menu" class="box centered">
            <!-- child elements of menu -->
            <div id="row1" class="box centered-items"></div>
            <div id="row2" class="box centered-items"></div>

            <div id="menuTitle" class="box centrered">AI in emergency response</div>
            <img src="images/AIpngforELA.png" alt="AI image" id="menu-image1">
            <div id="music_starter" class = "box">Click me to start music!</div>
    </div>
    </div>
    <div id="phoneBody">
        <!-- all visible elements for phone -->
        <div id="TemporaryBarrier" class="centered centered-items">
            You have hit a barrier. this website is not yet compatible for your device. 
            this intends to only stop phones.
            if you're not using a phone and this occours, please contact the owner of this repository
        </div>

        <div id="phoneMenu" class="centered">
            <!-- child elements of phone menu -->
            <div id="phoneMenuTitle" class="horizontally-centered horizontally-centered-items">
                AI in Emergency Response
            </div>

            <div id="phoneRow1" class="horizontally-centered horizontally-centered-items">
                
            </div>
            
            


        </div>
    </div>
</body>
